name: Aktualizace RSS Archiweb

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Příprava Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace knihoven
        run: pip install -r requirements.txt

      - name: Spuštění skriptu
        run: python scraper.py

      - name: Uložení vygenerovaného RSS
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add feed.xml
          git diff-index --quiet HEAD || git commit -m "Automatická aktualizace RSS"
          git pull --rebase origin main
          git push origin main
